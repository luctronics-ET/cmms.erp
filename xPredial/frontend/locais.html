<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>xPredial · Locais e Prédios</title>
  <link rel="stylesheet" href="http://localhost:8010/assets/xcmasm-shell.css" />
  <link rel="stylesheet" href="http://localhost:8010/assets/fonts.css" />
  <style>
    .moverlay { position: fixed; inset: 0; background: rgba(7, 17, 31, 0.75); z-index: 1000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
    .moverlay.open { display: flex; }
    .modal { background: var(--xc-bg2); border: 1px solid var(--xc-line2); border-radius: var(--xc-r3); width: min(600px, 95vw); max-height: 90vh; display: flex; flex-direction: column; box-shadow: var(--xc-shadow); animation: xc-modalin .2s ease; }
    .mhdr { padding: 15px 20px; border-bottom: 1px solid var(--xc-line); display: flex; align-items: center; justify-content: space-between; }
    .mbody { padding: 20px; overflow-y: auto; flex: 1; }
    .mfooter { padding: 13px 20px; border-top: 1px solid var(--xc-line); display: flex; gap: 8px; justify-content: flex-end; }
    .tree-cell { display: flex; align-items: center; gap: 8px; }
    .tree-toggle { width: 22px; height: 22px; border: 1px solid var(--xc-line); border-radius: 4px; background: var(--xc-bg3); color: var(--xc-tx2); cursor: pointer; display: flex; align-items: center; justify-content: center; font-family: var(--xc-mono); font-size: 14px; }
    .tree-toggle:hover { border-color: var(--xc-acc); color: var(--xc-tx); }
  </style>
</head>
<body class="xcmasm-shell">
  <div id="app"></div>

  <template id="page-content">
    <div class="xc-card">
      <div class="xc-card-head">
        <div class="xc-card-title">Inventário de Locais</div>
        <div class="xc-flex xc-gap8">
          <button id="colapsarTudo" class="xc-btn xc-btn-g xc-btn-sm">Recolher</button>
          <button id="expandirTudo" class="xc-btn xc-btn-g xc-btn-sm">Expandir</button>
          <button id="adicionar" class="xc-btn xc-btn-p xc-btn-sm">+ Novo Local</button>
        </div>
      </div>
      <div class="xc-table-wrap">
        <table class="xc-table">
          <thead><tr><th>NEO</th><th>Nome</th><th>Tipo</th><th>Área</th><th>Ação</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </template>

  <div id="modalLocal" class="moverlay">
    <div class="modal">
      <div class="mhdr">
        <h3 id="tituloModalLocal" class="xc-tb-title">Cadastrar Local Predial</h3>
        <button id="fecharModal" class="xc-btn xc-btn-g xc-btn-xs" style="padding:4px 8px">✕</button>
      </div>
      <div class="mbody">
        <div class="xc-g2">
          <div class="xc-fg" style="grid-column: 1 / -1">
            <label class="xc-mono" style="font-size:10px; font-weight:700; color:var(--xc-tx3); text-transform:uppercase;">Nome do Local / Sala / Prédio</label>
            <input id="nome" class="xc-search-inp" style="padding-left:12px" placeholder="Ex.: Prédio Administrativo" />
          </div>
          <div class="xc-fg">
            <label class="xc-mono" style="font-size:10px; font-weight:700; color:var(--xc-tx3); text-transform:uppercase;">Código NEO / Patrimônio</label>
            <input id="codigo" class="xc-search-inp" style="padding-left:12px" placeholder="Ex.: CMASM-34.2" />
          </div>
          <div class="xc-fg">
            <label class="xc-mono" style="font-size:10px; font-weight:700; color:var(--xc-tx3); text-transform:uppercase;">Área CMASM</label>
            <select id="area_cmasm" class="xc-search-inp" style="padding-left:12px">
              <option value="">(não definida)</option>
              <option value="ADM">ADM — Administrativa</option>
              <option value="OPE">OPE — Operativa</option>
              <option value="APA">APA — Preservação Ambiental</option>
            </select>
          </div>
          <div class="xc-fg">
            <label class="xc-mono" style="font-size:10px; font-weight:700; color:var(--xc-tx3); text-transform:uppercase;">Tipo de Espaço</label>
            <select id="tipo" class="xc-search-inp" style="padding-left:12px">
              <option value="OM">OM</option>
              <option value="edificio">Edifício</option>
              <option value="sala">Sala</option>
              <option value="oficina">Oficina</option>
              <option value="paiol">Paiol</option>
              <option value="area_externa">Área Externa</option>
              <option value="banheiro">Banheiro</option>
              <option value="area_tecnica">Área Técnica</option>
            </select>
          </div>
          <div class="xc-fg">
            <label class="xc-mono" style="font-size:10px; font-weight:700; color:var(--xc-tx3); text-transform:uppercase;">Nível de Restrição</label>
            <select id="restricao" class="xc-search-inp" style="padding-left:12px">
              <option value="">(sem restrição)</option>
              <option value="civil">Civil</option>
              <option value="militar">Militar</option>
              <option value="reservado">Reservado</option>
              <option value="secreto">Secreto</option>
              <option value="proibido">Proibido</option>
            </select>
          </div>
          <div class="xc-fg" style="grid-column: 1 / -1">
            <label class="xc-mono" style="font-size:10px; font-weight:700; color:var(--xc-tx3); text-transform:uppercase;">Localização Hierárquica (Pai)</label>
            <select id="parent" class="xc-search-inp" style="padding-left:12px"></select>
          </div>
          <div class="xc-fg">
            <label class="xc-mono" style="font-size:10px; font-weight:700; color:var(--xc-tx3); text-transform:uppercase;">Área Útil (m²)</label>
            <input id="area" class="xc-search-inp" style="padding-left:12px" type="number" step="0.1" />
          </div>
        </div>
      </div>
      <div class="mfooter">
        <button id="salvar" class="xc-btn xc-btn-p">Salvar Local</button>
      </div>
    </div>
  </div>

  <div id="modalLocalDetalhes" class="moverlay">
    <div class="modal" style="width: min(800px, 95vw);">
      <div class="mhdr">
        <h3 id="detalhesTitulo" class="xc-tb-title">Detalhes do Local</h3>
        <button onclick="fecharModalDetalhes()" class="xc-btn xc-btn-g xc-btn-xs" style="padding:4px 8px">✕</button>
      </div>
      <div class="mbody" id="detalhesBody" style="padding: 18px;">
        <!-- populated by js -->
      </div>
    </div>
  </div>

  <script src="http://localhost:8010/assets/xcmasm-shell.js"></script>
  <script src="assets/predial-api.js"></script>
  <script>
    xShell.init({
      activePage: 'predial',
      pageTitle: 'xPredial · Inventário de Locais',
      subtitle: 'Estrutura Física CMASM'
    });
    document.getElementById('xc-content').appendChild(document.getElementById('page-content').content.cloneNode(true));

    const modal = document.getElementById("modalLocal");
    const collapsedNodes = new Set();
    let currentLocais = [];

    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\"/g, "&quot;").replace(/'/g, "&#39;");
    }

    function abrirModal() { modal.classList.add("open"); }
    function fecharModal() { modal.classList.remove("open"); }
    function fecharModalDetalhes() { document.getElementById("modalLocalDetalhes").classList.remove("open"); }
    
    function abrirModalDetalhes(id) {
      const local = currentLocais.find(l => l.id === id);
      if (!local) return;
      document.getElementById("detalhesTitulo").textContent = `Ficha Técnica: ${local.nome} (${local.neo || 'Sem NEO'})`;
      
      const html = `
        <div class="xc-g2 xc-mb16">
          <div class="xc-card">
            <div class="xc-card-head"><div class="xc-card-title">Dados do Ativo Predial</div></div>
            <div class="xc-card-body xc-tx2-col" style="font-size: 12px; display: flex; flex-direction: column; gap: 6px;">
              <div><span class="xc-mono" style="display:inline-block; width:120px">Tipo:</span> <b class="xc-tx">${local.tipo}</b></div>
              <div><span class="xc-mono" style="display:inline-block; width:120px">Área:</span> <b class="xc-tx">${local.area || '—'}</b></div>
              <div><span class="xc-mono" style="display:inline-block; width:120px">Restrição:</span> <b class="xc-tx">${local.restricao || '—'}</b></div>
              <div><span class="xc-mono" style="display:inline-block; width:120px">Área Útil:</span> <b class="xc-tx">${local.area_m2 ? local.area_m2 + ' m²' : '—'}</b></div>
            </div>
          </div>

          <div class="xc-card">
            <div class="xc-card-head"><div class="xc-card-title">Classificação Normativa</div></div>
            <div class="xc-card-body">
              <div class="xc-fg xc-mb12">
                <label class="xc-mono" style="font-size:9px">Classe Manutenção (NBR 5674)</label>
                <select class="xc-search-inp" style="padding-left:8px"><option>Rotineira</option><option>Preventiva</option><option>Corretiva</option></select>
              </div>
              <div class="xc-fg">
                <label class="xc-mono" style="font-size:9px">Vida Útil (NBR 15575)</label>
                <select class="xc-search-inp" style="padding-left:8px"><option>Mínimo (≥ 50a)</option><option>Intermediário (≥ 75a)</option><option>Superior (≥ 100a)</option></select>
              </div>
            </div>
          </div>
        </div>

        <div class="xc-card">
            <div class="xc-card-head">
                <div class="xc-card-title">Sistemas Prediais Inspecionáveis</div>
                <button class="xc-btn xc-btn-g xc-btn-xs">+ Novo</button>
            </div>
            <div class="xc-table-wrap">
              <table class="xc-table">
                <thead><tr><th>Sistema</th><th>Estado</th><th>Última Insp.</th></tr></thead>
                <tbody>
                  <tr><td>Elétrico / Iluminação</td><td><span class="xc-badge xc-badge-grn">Operacional</span></td><td class="xc-mono">10/03/2026</td></tr>
                  <tr><td>Hidrossanitário</td><td><span class="xc-badge xc-badge-amb">Atenção</span></td><td class="xc-mono">15/02/2026</td></tr>
                  <tr><td>Climatização (AVAC)</td><td><span class="xc-badge xc-badge-grn">Operacional</span></td><td class="xc-mono">01/04/2026</td></tr>
                </tbody>
              </table>
            </div>
        </div>
        <div style="margin-top: 16px; display: flex; gap: 8px; justify-content: flex-end;">
            <button class="xc-btn xc-btn-g" onclick="fecharModalDetalhes()">Fechar</button>
            <button class="xc-btn xc-btn-p" onclick="fecharModalDetalhes()">Salvar Classificação</button>
        </div>
      `;
      document.getElementById("detalhesBody").innerHTML = html;
      document.getElementById("modalLocalDetalhes").classList.add("open");
    }

    async function carregarPais(locais) {
      document.getElementById("parent").innerHTML = `<option value="">(raiz / sem pai)</option>` + locais.map(l => `<option value="${l.id}">${l.nome}</option>`).join("");
    }

    function buildTree(locais) {
      const neoKey = (value) => (value || "~").toString();
      const ordered = [...locais].sort((a, b) => neoKey(a.neo).localeCompare(neoKey(b.neo), "pt-BR", { numeric: true }));
      const byParent = new Map();
      for (const local of ordered) {
        const key = local.parent_id || 0;
        if (!byParent.has(key)) byParent.set(key, []);
        byParent.get(key).push(local);
      }
      const rows = [];
      function walk(parentId, level, hiddenByAncestor) {
        const children = byParent.get(parentId || 0) || [];
        for (const node of children) {
          const hasChildren = (byParent.get(node.id) || []).length > 0;
          const isCollapsed = collapsedNodes.has(node.id);
          rows.push({ node, level, hasChildren, isCollapsed, hidden: hiddenByAncestor });
          walk(node.id, level + 1, hiddenByAncestor || isCollapsed);
        }
      }
      walk(null, 0, false);
      return rows;
    }

    async function refresh() {
      try {
        const locais = await predialAPI.listLocais();
        currentLocais = locais;
        await carregarPais(locais);
        const rows = buildTree(locais);
        document.getElementById("rows").innerHTML = rows.map(r => {
          const leftPad = r.level * 20;
          const toggle = r.hasChildren ? `<button class="tree-toggle" data-id="${r.node.id}">${r.isCollapsed ? "+" : "-"}</button>` : `<div style="width:22px"></div>`;
          const areaBadge = {
            'ADM': 'xc-badge-acc',
            'OPE': 'xc-badge-grn',
            'APA': 'xc-badge-tel'
          }[r.node.area] || 'xc-badge-tx2';
          
          return `
          <tr ${r.hidden ? "style=\"display:none\"" : ""}>
            <td class="xc-mono" style="font-size:11px">${r.node.neo || "-"}</td>
            <td>
              <div class="tree-cell" style="padding-left:${leftPad}px">
                ${toggle}
                <span style="font-weight:600">${r.node.nome}</span>
              </div>
            </td>
            <td class="xc-tx2-col" style="font-size:11px">${r.node.tipo}</td>
            <td><span class="xc-badge ${areaBadge}">${r.node.area || 'N/A'}</span></td>
            <td><button class="xc-btn xc-btn-g xc-btn-xs" onclick="abrirModalDetalhes(${r.node.id})">Detalhes</button></td>
          </tr>`;
        }).join("");

        document.querySelectorAll(".tree-toggle[data-id]").forEach((btn) => {
          btn.addEventListener("click", (e) => {
            e.stopPropagation();
            const id = Number(btn.dataset.id);
            if (collapsedNodes.has(id)) collapsedNodes.delete(id);
            else collapsedNodes.add(id);
            refresh();
          });
        });
      } catch (err) { console.error(err); }
    }

    document.getElementById("salvar").addEventListener("click", async () => {
      try {
        await predialAPI.createLocal({
          codigo: document.getElementById("codigo").value || null,
          area: document.getElementById("area_cmasm").value || null,
          restricao: document.getElementById("restricao").value || null,
          nome: document.getElementById("nome").value,
          tipo: document.getElementById("tipo").value,
          parent_id: document.getElementById("parent").value ? Number(document.getElementById("parent").value) : null,
          area_m2: document.getElementById("area").value ? Number(document.getElementById("area").value) : null,
        });
        fecharModal();
        await refresh();
      } catch (err) { alert(err.message); }
    });

    document.getElementById("adicionar").addEventListener("click", abrirModal);
    document.getElementById("fecharModal").addEventListener("click", fecharModal);
    document.getElementById("colapsarTudo").addEventListener("click", () => {
      const pids = new Set(currentLocais.map(l => l.parent_id).filter(id => id));
      collapsedNodes.clear();
      pids.forEach(id => collapsedNodes.add(id));
      refresh();
    });
    document.getElementById("expandirTudo").addEventListener("click", () => {
      collapsedNodes.clear();
      refresh();
    });

    refresh();
  </script>
</body>
</html>
