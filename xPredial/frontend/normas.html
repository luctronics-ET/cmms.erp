<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>xPredial · Referências Normativas</title>
  <link rel="stylesheet" href="http://localhost:8010/assets/xcmasm-shell.css" />
  <link rel="stylesheet" href="http://localhost:8010/assets/fonts.css" />
  <style>
    .moverlay { position: fixed; inset: 0; background: rgba(7, 17, 31, 0.75); z-index: 1000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
    .moverlay.open { display: flex; }
    .modal { background: var(--xc-bg2); border: 1px solid var(--xc-line2); border-radius: var(--xc-r3); width: min(600px, 95vw); max-height: 90vh; display: flex; flex-direction: column; box-shadow: var(--xc-shadow); animation: xc-modalin .2s ease; }
    .mhdr { padding: 15px 20px; border-bottom: 1px solid var(--xc-line); display: flex; align-items: center; justify-content: space-between; }
    .mbody { padding: 20px; overflow-y: auto; flex: 1; }
    .mfooter { padding: 13px 20px; border-top: 1px solid var(--xc-line); display: flex; gap: 8px; justify-content: flex-end; }
  </style>
</head>
<body class="xcmasm-shell">
  <div id="app"></div>

  <template id="page-content">
    <div class="xc-card">
      <div class="xc-card-head">
        <div class="xc-card-title">Referências Normativas (ABNT)</div>
        <button class="xc-btn xc-btn-p xc-btn-sm" onclick="abrirModal()">+ Nova Norma</button>
      </div>
      <div class="xc-table-wrap">
        <table class="xc-table">
          <thead>
            <tr>
              <th style="width:120px">Código</th>
              <th>Título</th>
              <th>Descrição</th>
              <th style="width:120px">Link</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </template>

  <div id="modalNorma" class="moverlay">
    <div class="modal" style="width:500px">
      <div class="mhdr">
        <h3 class="xc-tb-title">Adicionar Referência Normativa</h3>
        <button class="xc-btn xc-btn-g xc-btn-xs" onclick="fecharModal()" style="padding:4px 8px">✕</button>
      </div>
      <div class="mbody">
        <div class="xc-g2 xc-mb12">
          <div class="xc-fg">
            <label class="xc-mono" style="font-size:10px">Código</label>
            <input id="n-codigo" class="xc-search-inp" style="padding-left:12px" placeholder="Ex: NBR 5674">
          </div>
          <div class="xc-fg">
            <label class="xc-mono" style="font-size:10px">Título</label>
            <input id="n-titulo" class="xc-search-inp" style="padding-left:12px" placeholder="Ex: Manutenção de Edificações">
          </div>
        </div>
        <div class="xc-fg xc-mb12">
          <label class="xc-mono" style="font-size:10px">Descrição / Objetivo</label>
          <textarea id="n-desc" class="xc-search-inp" style="padding:8px 12px; height:80px; resize:vertical"></textarea>
        </div>
        <div class="xc-fg">
          <label class="xc-mono" style="font-size:10px">Link do Documento (URL)</label>
          <input id="n-link" class="xc-search-inp" style="padding-left:12px" placeholder="https://...">
        </div>
      </div>
      <div class="mfooter">
        <button class="xc-btn xc-btn-p" onclick="salvar()">Salvar Referência</button>
      </div>
    </div>
  </div>

  <script src="http://localhost:8010/assets/xcmasm-shell.js"></script>
  <script src="assets/predial-api.js"></script>
  <script>
    xShell.init({
      activePage: 'predial',
      pageTitle: 'xPredial · Referências Técnicas',
      subtitle: 'Base Normativa CMASM'
    });
    document.getElementById('xc-content').appendChild(document.getElementById('page-content').content.cloneNode(true));

    async function refresh() {
      try {
        const normas = await predialAPI.listNormas();
        document.getElementById("rows").innerHTML = normas.map(n => `
          <tr>
            <td><b class="xc-tx-acc xc-mono" style="font-size:12px">${n.codigo}</b></td>
            <td><b class="xc-tx">${n.titulo}</b></td>
            <td class="xc-tx2-col" style="font-size:11px">${n.descricao || '-'}</td>
            <td>${n.link_documento ? `<a href="${n.link_documento}" target="_blank" class="xc-btn xc-btn-g xc-btn-xs">Acessar ↗</a>` : '-'}</td>
          </tr>
        `).join("");
      } catch (err) { console.error(err); }
    }

    function abrirModal() { document.getElementById("modalNorma").classList.add("open"); }
    function fecharModal() { document.getElementById("modalNorma").classList.remove("open"); }

    async function salvar() {
      try {
        await predialAPI.createNorma({
          codigo: document.getElementById("n-codigo").value,
          titulo: document.getElementById("n-titulo").value,
          descricao: document.getElementById("n-desc").value,
          link_documento: document.getElementById("n-link").value
        });
        fecharModal();
        refresh();
      } catch (err) { alert(err.message); }
    }

    refresh();
  </script>
</body>
</html>
