<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
    <h:head>
        <title>Teste Câmeras</title>
    </h:head>
    <h:body>
        <ui:decorate template="/templates/decoratorLogin.xhtml">
            <h1>TESTE: Gerenciador de Câmeras</h1>

            <h2>Debug Info:</h2>
            <p>CameraManager: <h:outputText value="#{cameraManager}" /></p>
            <p>CamerasBean: <h:outputText value="#{camerasBean}" /></p>

            <h2>Total de Câmeras: <h:outputText value="#{camerasBean.cameras.size()}" /></h2>

            <h2>Locais Disponíveis:</h2>
            <ul>
                <ui:repeat var="local" value="#{camerasBean.locaisComCamera}">
                    <li>#{local}</li>
                </ui:repeat>
            </ul>

            <h2>Primeiras 5 Câmeras:</h2>
            <table border="1">
                <tr>
                    <th>ID</th>
                    <th>IP</th>
                    <th>Local</th>
                    <th>Tipo</th>
                </tr>
                <ui:repeat var="cam" value="#{camerasBean.cameras}" varStatus="status">
                    <tr rendered="#{status.index lt 5}">
                        <td>#{cam.id}</td>
                        <td>#{cam.ip}</td>
                        <td>#{cam.local}</td>
                        <td>#{cam.tipoEquipamento}</td>
                    </tr>
                </ui:repeat>
            </table>
        </ui:decorate>
    </h:body>
</html>
