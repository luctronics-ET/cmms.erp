services:
  xpredial-api:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "pip install -r requirements.txt && uvicorn backend.main:app --host 0.0.0.0 --port 8002"
    environment:
      - PREDIAL_DB_PATH=/app/data/predial.db
    ports:
      - "8002:8002"

  xpredial-frontend:
    image: python:3.11-slim
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
    command: python -m http.server 3001
    ports:
      - "3001:3001"
