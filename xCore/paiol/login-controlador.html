<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xPaiol — Acionamento de Rel&eacute; com Login</title>
    <link rel="stylesheet" href="css/bulma.css" />
</head>
<body>
    <div class="block" id="vue_root">
        <div class="box">
            <div class="columns">
                <div class="column is-2">
                    <h1 class="title is-5">Login</h1>
                </div>
                <div class="column is-2">
                    <label class="label">Usu&aacute;rio</label>
                    <div class="control">
                        <input class="input" type="user" placeholder="Ex.: joao" v-model="user">
                    </div>
                </div>
                <div class="column is-4">
                    <label class="label">Senha</label>
                    <div class="control">
                        <input class="input" type="password" placeholder="********" v-model="password">
                    </div>
                </div>
            </div>
        </div>

        <div class="box">
            <p class="title is-5">1 - Acionar rel&eacute;</p>
            <button :class="{ 'button': true, 'is-success': acionado, 'is-danger': !acionado }" @click="toggle_ar_condicionado()">
                {{ acionado ? "Desativar ar ligado" : "Ativar ar desligado" }}
            </button>
        </div>

        <div class="box">
            <h1 class="title is-5">2 - Alterar senha</h1>
            <h6 v-if="msg_password_big.length > 0">{{ msg_password_big }}</h6>
            <div class="columns">
                <div class="column is-2">
                    <label class="label">Usu&aacute;rio</label>
                    <input class="input" type="user" placeholder="Ex.: joao" v-model="user_to_change">
                </div>
                <div class="column is-4">
                    <label class="label">Nova senha</label>
                    <input class="input" type="password" placeholder="********" v-model="password_to_change">
                </div>
                <div class="column is-4">
                    <label class="label">Confirmar senha</label>
                    <input class="input" type="password" placeholder="********" v-model="password_to_change_confirmation">
                </div>
                <div class="column is-2">
                    <label class="label">&nbsp;</label>
                    <div class="buttons">
                        <button class="button is-link" @click="change_user_password()">Alterar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="js/vue.js"></script>
    <script src="js/login-controlador.js"></script>
</body>
</html>
