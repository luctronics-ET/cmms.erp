<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xPaiol | Monitoramento Operacional</title>
    <link rel="stylesheet" href="css/paiois-dashboard.css">
</head>
<body>
    <div class="shell">
        <header class="hero">
            <h1>Monitoramento de Paiois</h1>
        </header>

        <main>
            <div id="sectionsRoot" class="sections"></div>
        </main>
    </div>

    <div class="modal" id="paiolModal" aria-hidden="true">
        <div class="modal-backdrop" data-close="true"></div>
        <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <button class="modal-close" id="closeModal" aria-label="Fechar">×</button>

            <div class="modal-header">
                <div>
                    <p class="eyebrow" id="modalEyebrow"></p>
                    <h2 id="modalTitle"></h2>
                </div>
                <div class="status-pill" id="modalStatus"></div>
            </div>

            <div class="modal-grid">
                <section class="panel camera-panel">
                    <div class="panel-heading">Camera</div>
                    <img id="modalCamera" alt="Visualizacao da camera do paiol">
                    <div class="panel-actions">
                        <a id="cameraAction" class="action-link action-link--muted" href="#">Stream pendente</a>
                    </div>
                </section>

                <section class="panel">
                    <div class="panel-heading">Sensores e infraestrutura</div>
                    <dl class="details-list" id="sensorDetails"></dl>
                </section>

                <section class="panel panel-wide">
                    <div class="panel-heading">Ultima leitura</div>
                    <div class="reading-grid" id="readingGrid"></div>
                    <div class="alarm-list" id="alarmList"></div>
                </section>

                <section class="panel panel-wide">
                    <div class="panel-heading">Acoes rapidas</div>
                    <div class="quick-actions">
                        <a id="sensorAction" class="action-link" href="#" target="_blank" rel="noreferrer">Abrir pagina do sensor</a>
                        <a id="cameraPageAction" class="action-link action-link--muted" href="#" target="_blank" rel="noreferrer">Abrir pagina da camera</a>
                    </div>
                </section>

                <section class="panel panel-wide">
                    <div class="panel-heading">Tratativa de Alarme (Latch)</div>
                    <div class="alarm-actions">
                        <button id="btnFalseAlarm" class="action-btn">FALSO AL</button>
                        <button id="btnOp" class="action-btn">OP</button>
                        <button id="btnEmerg" class="action-btn action-btn--emerg">EMERG</button>
                        <button id="btnAcao" class="action-btn action-btn--acao">ACAO</button>
                    </div>
                    <label class="obs-label" for="obsInput">Observacoes</label>
                    <textarea id="obsInput" class="obs-input" rows="3" placeholder="Descreva o ocorrido e a acao tomada..."></textarea>
                    <div class="obs-meta" id="obsMeta"></div>
                </section>

                <section class="panel panel-wide">
                    <div class="panel-heading">Limites do Paiol</div>
                    <div class="limits-grid">
                        <label class="limit-field">
                            <span>TMP Min</span>
                            <input id="limitTempMin" type="number" step="0.1">
                        </label>
                        <label class="limit-field">
                            <span>TMP Max</span>
                            <input id="limitTempMax" type="number" step="0.1">
                        </label>
                        <label class="limit-field">
                            <span>UMD Min</span>
                            <input id="limitHumMin" type="number" step="0.1">
                        </label>
                        <label class="limit-field">
                            <span>UMD Max</span>
                            <input id="limitHumMax" type="number" step="0.1">
                        </label>
                    </div>
                    <div class="limits-actions">
                        <button id="btnSaveLimits" class="action-btn">Salvar limites</button>
                    </div>
                    <div class="obs-meta" id="limitsMeta"></div>
                </section>

                <section class="panel panel-wide">
                    <div class="panel-heading">Valores dos Sensores</div>
                    <div class="limits-grid">
                        <label class="limit-field">
                            <span>Temperatura</span>
                            <input id="sensorTemp" type="number" step="0.1">
                        </label>
                        <label class="limit-field">
                            <span>Umidade</span>
                            <input id="sensorHum" type="number" step="0.1">
                        </label>
                        <label class="limit-field">
                            <span>Temp. Sonda</span>
                            <input id="sensorTempExt" type="number" step="0.1">
                        </label>
                        <label class="limit-field">
                            <span>Orvalho</span>
                            <input id="sensorDew" type="number" step="0.1">
                        </label>
                        <label class="limit-field">
                            <span>IN1</span>
                            <select id="sensorIn1">
                                <option value="0">Inativo</option>
                                <option value="1">Ativo</option>
                            </select>
                        </label>
                        <label class="limit-field">
                            <span>IN2</span>
                            <select id="sensorIn2">
                                <option value="0">Inativo</option>
                                <option value="1">Ativo</option>
                            </select>
                        </label>
                        <label class="limit-field">
                            <span>Saida Rele</span>
                            <select id="sensorOut1">
                                <option value="0">Inativo</option>
                                <option value="1">Ativo</option>
                            </select>
                        </label>
                    </div>
                    <div class="limits-actions">
                        <button id="btnSaveSensorValues" class="action-btn">Salvar valores</button>
                    </div>
                    <div class="obs-meta" id="sensorValuesMeta"></div>
                </section>
            </div>
        </div>
    </div>

    <script src="js/paiois-dashboard.js"></script>
</body>
</html>
