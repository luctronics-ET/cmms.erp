<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>xPredial - Laudos e ARTs</title>
  <link rel="stylesheet" href="assets/xpredial-core.css" />
    <link rel="stylesheet" href="../../assets/fonts.css"></head>
<body>
  <header id="top"></header>
  <main>
    <section class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px">
        <h2>Gestão de Laudos e ARTs</h2>
        <button class="btn btn-p" onclick="abrirModal()">+ Novo Laudo</button>
      </div>
      <div class="tw">
        <table>
          <thead>
            <tr>
              <th>Título</th>
              <th>Tipo</th>
              <th>Local</th>
              <th>Emissão</th>
              <th>Validade</th>
              <th>Arquivo</th>
              <th style="width: 140px;">Ações</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="modalLaudo" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:1000; align-items:center; justify-content:center; backdrop-filter:blur(2px)">
    <div class="modal" style="width:500px">
      <div class="mhdr">
        <h3>Cadastrar Novo Laudo</h3>
        <button class="btn btn-s" onclick="fecharModal()" style="padding:4px 8px">✕</button>
      </div>
      <div class="mbody">
        <div class="fg"><label>Título do Documento</label><input id="l-titulo" placeholder="Ex: ART Manutenção Elétrica 2026"></div>
        <div class="grid" style="grid-template-columns:1fr 1fr">
          <div class="fg">
            <label>Tipo</label>
            <select id="l-tipo">
              <option value="ART">ART</option>
              <option value="RRT">RRT</option>
              <option value="Garantia">Garantia</option>
              <option value="Tecnico">Laudo Técnico</option>
              <option value="Outro">Outro</option>
            </select>
          </div>
          <div class="fg"><label>Local</label><select id="l-local"></select></div>
          <div class="fg"><label>Data de Emissão</label><input type="date" id="l-emissao"></div>
          <div class="fg"><label>Validade</label><input type="date" id="l-validade"></div>
        </div>
        <div class="fg"><label>Caminho do Arquivo (Simulado)</label><input id="l-path" placeholder="/uploads/laudos/doc.pdf"></div>
      </div>
      <div class="mfooter">
        <button class="btn btn-p" onclick="salvar()">Salvar Laudo</button>
      </div>
    </div>
  </div>

  <div id="modalDetalhesLaudo" class="moverlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:1000; align-items:center; justify-content:center; backdrop-filter:blur(2px)">
    <div class="modal" style="width: min(900px, 95vw); max-height: 90vh; display: flex; flex-direction: column;">
      <div class="mhdr">
        <h3 id="detalhesLaudoTitulo">Análise Normativa - Laudo</h3>
        <button class="btn btn-s" onclick="fecharModalDetalhesLaudo()" style="padding:4px 8px">✕</button>
      </div>
      <div class="mbody" style="overflow-y: auto; flex: 1; padding: 18px;">
        <div class="grid" style="grid-template-columns: 1fr 1fr; margin-bottom: 24px; gap: 16px;">
          <div class="fg" style="margin:0">
             <label>Referência Normativa Principal</label>
             <input type="text" placeholder="Ex: NBR 5674, NBR 13752" value="NBR 16747 - Inspeção Predial">
          </div>
          <div class="fg" style="margin:0">
             <label>Grau de Risco (Geral)</label>
             <select>
                <option>Crítico (Risco a saúde/segurança)</option>
                <option>Regular (Perda de funcionalidade)</option>
                <option>Mínimo (Pequenos reparos estéticos)</option>
             </select>
          </div>
        </div>
        
        <h4 style="color: var(--acc); margin-bottom: 12px; border-bottom: 1px solid var(--line); padding-bottom: 8px;">Matriz de Verificação Técnica</h4>
        <div class="tw" style="border: 1px solid var(--line); border-radius: 6px; overflow:hidden;">
          <table style="margin:0">
            <thead style="background: var(--bg)">
              <tr>
                <th style="width:20%">Sistema Inspecionado</th>
                <th style="width:30%">Anomalia / Falha</th>
                <th style="width:20%">Origem</th>
                <th style="width:30%">Recomendação Técnica</th>
              </tr>
            </thead>
            <tbody style="background: var(--bg3)">
              <tr>
                <td><input type="text" value="Fundações e Estrutura" style="width: 100%; border: none; background: transparent; color: var(--text);"></td>
                <td><textarea rows="2" style="width: 100%; border: 1px solid var(--line); background: var(--bg2); color: var(--text); padding: 4px; font-family: var(--sans); border-radius:4px; resize:vertical">Sem anomalias visíveis na data de vistoria.</textarea></td>
                <td>
                  <select style="width: 100%; padding: 4px; background: var(--bg2); border: 1px solid var(--line); color: var(--text); border-radius:4px;">
                    <option>Endógena (Projeto)</option>
                    <option>Exógena (Terceiros)</option>
                    <option>Natural (Idade)</option>
                    <option>Funcional (Uso)</option>
                    <option selected>Não aplicável</option>
                  </select>
                </td>
                <td><textarea rows="2" style="width: 100%; border: 1px solid var(--line); background: var(--bg2); color: var(--text); padding: 4px; font-family: var(--sans); border-radius:4px; resize:vertical">Manter plano de manutenção preventiva vigente.</textarea></td>
              </tr>
              <tr>
                <td><input type="text" value="Instalações Elétricas" style="width: 100%; border: none; background: transparent; color: var(--text);"></td>
                <td><textarea rows="2" style="width: 100%; border: 1px solid var(--line); background: var(--bg2); color: var(--text); padding: 4px; font-family: var(--sans); border-radius:4px; resize:vertical">Quadro QDC com sinais de oxidação e sem DR.</textarea></td>
                <td>
                  <select style="width: 100%; padding: 4px; background: var(--bg2); border: 1px solid var(--line); color: var(--text); border-radius:4px;">
                    <option>Endógena (Projeto)</option>
                    <option>Exógena (Terceiros)</option>
                    <option>Natural (Idade)</option>
                    <option selected>Funcional (Uso)</option>
                    <option>Não aplicável</option>
                  </select>
                </td>
                <td><textarea rows="2" style="width: 100%; border: 1px solid var(--line); background: var(--bg2); color: var(--text); padding: 4px; font-family: var(--sans); border-radius:4px; resize:vertical">Instalar DR. Realizar limpeza. Prazo: 30 dias.</textarea></td>
              </tr>
              <tr>
                <td><input type="text" placeholder="Adicionar sistema..." style="width: 100%; border: none; background: transparent; color: var(--text);"></td>
                <td><textarea rows="2" placeholder="Descrever anomalia..." style="width: 100%; border: 1px solid var(--line); background: var(--bg2); color: var(--text); padding: 4px; font-family: var(--sans); border-radius:4px; resize:vertical"></textarea></td>
                <td>
                  <select style="width: 100%; padding: 4px; background: var(--bg2); border: 1px solid var(--line); color: var(--text); border-radius:4px;">
                    <option>Selecione...</option>
                    <option>Endógena (Projeto)</option>
                    <option>Exógena (Terceiros)</option>
                    <option>Natural (Idade)</option>
                    <option>Funcional (Uso)</option>
                  </select>
                </td>
                <td><textarea rows="2" placeholder="Recomendação técnica..." style="width: 100%; border: 1px solid var(--line); background: var(--bg2); color: var(--text); padding: 4px; font-family: var(--sans); border-radius:4px; resize:vertical"></textarea></td>
              </tr>
            </tbody>
          </table>
        </div>
        <button class="btn btn-s" style="margin-top: 12px;">+ Adicionar Item Normativo</button>
      </div>
      <div class="mfooter" style="padding: 12px 18px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end;">
        <button class="btn btn-p" onclick="xPredialUI.toast('Análise normativa salva!'); fecharModalDetalhesLaudo()">Salvar Matriz Normativa</button>
      </div>
    </div>
  </div>

  <script src="assets/predial-api.js"></script>
  <script src="assets/predial.js"></script>
  <script>
    xPredialUI.setHeader("laudos.html", "Acervo digital de responsabilidades técnicas.");

    let currentLaudos = [];
    async function refresh() {
      try {
        const laudos = await predialAPI.listLaudos();
        currentLaudos = laudos;
        document.getElementById("rows").innerHTML = laudos.map(l => `
          <tr>
            <td><b style="color:var(--text)">${l.titulo}</b></td>
            <td>${xPredialUI.badge(l.tipo)}</td>
            <td>${l.local_nome}</td>
            <td>${l.data_emissao || '-'}</td>
            <td>${l.validade || '-'}</td>
            <td style="font-family:var(--mono); font-size:11px">${l.arquivo_path || '-'}</td>
            <td><button class="btn btn-s btn-sm" onclick="abrirModalDetalhesLaudo(${l.id})">Análise Normativa</button></td>
          </tr>
        `).join("");
      } catch (err) { xPredialUI.toast(err.message, "error"); }
    }

    function abrirModal() { 
      document.getElementById("modalLaudo").style.display = "flex"; 
      xPredialUI.loadLocaisSelect("l-local");
    }
    function fecharModal() { document.getElementById("modalLaudo").style.display = "none"; }
    
    function abrirModalDetalhesLaudo(id) {
      const laudo = currentLaudos.find(l => l.id === id);
      if(laudo) document.getElementById("detalhesLaudoTitulo").textContent = `Análise Normativa - ${laudo.titulo}`;
      document.getElementById("modalDetalhesLaudo").style.display = "flex";
    }
    function fecharModalDetalhesLaudo() { document.getElementById("modalDetalhesLaudo").style.display = "none"; }

    async function salvar() {
      try {
        await predialAPI.createLaudo({
          titulo: document.getElementById("l-titulo").value,
          tipo: document.getElementById("l-tipo").value,
          local_id: Number(document.getElementById("l-local").value),
          data_emissao: document.getElementById("l-emissao").value,
          validade: document.getElementById("l-validade").value,
          arquivo_path: document.getElementById("l-path").value
        });
        xPredialUI.toast("Laudo cadastrado com sucesso");
        fecharModal();
        refresh();
      } catch (err) { xPredialUI.toast(err.message, "error"); }
    }

    refresh();
  </script>
</body>
</html>
