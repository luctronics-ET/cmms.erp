<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>xPredial - Execucao de Inspecoes</title>
  <link rel="stylesheet" href="assets/xpredial-core.css" />
    <link rel="stylesheet" href="../../assets/fonts.css"></head>
<body>
  <header id="top"></header>
  <main>
    <div class="grid two">
      <section class="card">
        <h2>Controle de Inspeção</h2>
        <div class="fg">
          <label>Selecionar Inspeção Ativa ou Planejada</label>
          <select id="inspecao"></select>
        </div>
        <div id="meta" style="margin-bottom: 16px"></div>
        <div style="display:flex; gap:8px">
          <button id="iniciar" class="btn btn-p">Iniciar Execução</button>
          <button id="historicoBtn" class="btn btn-s">Ver Histórico</button>
        </div>
      </section>

      <section class="card">
        <h2>Análise Técnica (NBR 5674)</h2>
        <div class="fg">
          <label>Descrição da Degradação Encontrada</label>
          <textarea id="degradacao_desc" placeholder="Descreva sinais de fissuras, infiltrações, oxidação, etc."></textarea>
        </div>
        <div class="fg">
          <label>Estimativa de Perda de Desempenho</label>
          <textarea id="perda_desempenho_estimada" placeholder="Impacto na vida útil projetada (VUP) e riscos operacionais."></textarea>
        </div>
      </section>
    </div>

    <section class="card" style="margin-bottom: 24px; padding: 18px; border: 1px solid var(--line); background: var(--bg2);">
      <h2 style="margin-top: 0; margin-bottom: 16px; color: var(--acc); border-bottom: 1px solid var(--line); padding-bottom: 8px;">Classificação e Diagnóstico Global (NBR 5674 / NBR 15575)</h2>
      <div class="grid" style="grid-template-columns: 1fr 1fr 1fr; gap: 16px;">
        <div class="fg" style="margin: 0;">
          <label>Tipo de Manutenção</label>
          <select style="padding: 6px; font-size: 13px;">
            <option>Rotineira</option>
            <option>Preventiva</option>
            <option>Corretiva Planejada</option>
            <option>Corretiva Emergencial</option>
          </select>
        </div>
        <div class="fg" style="margin: 0;">
          <label>Nível de Inspeção</label>
          <select style="padding: 6px; font-size: 13px;">
            <option>Nível 1 (Sensorial/Visual)</option>
            <option>Nível 2 (Ensaios Simples)</option>
            <option>Nível 3 (Ensaios Complexos/Laboratório)</option>
          </select>
        </div>
        <div class="fg" style="margin: 0;">
          <label>Estado Geral de Conservação</label>
          <select style="padding: 6px; font-size: 13px;">
             <option>Excelente</option>
             <option>Bom</option>
             <option>Regular</option>
             <option>Ruim</option>
             <option>Péssimo / Crítico</option>
          </select>
        </div>
      </div>
    </section>

    <section class="card">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:16px">
        <h2>Checklist de Verificação</h2>
        <div id="msg" class="small" style="font-family: var(--mono)"></div>
      </div>
      <div class="tw">
        <table>
          <thead>
            <tr>
              <th>Item / Referência Normativa</th>
              <th style="width:140px">Condição</th>
              <th style="width:140px">Prioridade</th>
              <th>Observações Técnicas</th>
              <th style="width:80px"></th>
            </tr>
          </thead>
          <tbody id="itens"></tbody>
        </table>
      </div>
      <div style="margin-top: 20px; display: flex; justify-content: flex-end; gap: 10px;">
        <button id="salvarAnalise" class="btn btn-s">Salvar Análise Técnica</button>
        <button id="enviar" class="btn btn-p">Enviar para Aprovação</button>
      </div>
    </section>
  </main>

  <script src="assets/predial-api.js"></script>
  <script src="assets/predial.js"></script>
  <script>
    xPredialUI.setHeader("inspecoes.html", "Execução técnica e diagnóstico de sistemas.");

    async function refreshSelect() {
      try {
        const [planejadas, emExec] = await Promise.all([
          predialAPI.listInspecoes({ status: 'planejada' }),
          predialAPI.listInspecoes({ status: 'em_execucao' }),
        ]);
        const list = [...planejadas, ...emExec];
        const opts = list.map(i => `<option value="${i.id}">#${i.id} - ${i.titulo} (${i.status})</option>`).join("");
        document.getElementById("inspecao").innerHTML = `<option value="">Selecione uma inspeção...</option>${opts}`;
      } catch (err) {
        xPredialUI.toast("Erro ao carregar inspeções", "error");
      }
    }

    async function loadDetail() {
      const id = Number(document.getElementById("inspecao").value);
      if (!id) {
        document.getElementById("itens").innerHTML = "";
        document.getElementById("meta").innerHTML = "";
        return;
      }
      try {
        const inspecao = await predialAPI.getInspecao(id);
        document.getElementById("meta").innerHTML = `
          <div class="grid" style="grid-template-columns: 1fr 1fr; gap: 8px; margin-top:10px">
            <div class="small">Local: <b>${inspecao.local_nome || '-'}</b></div>
            <div class="small">Status: ${xPredialUI.badge(inspecao.status)}</div>
            <div class="small">Data Planejada: <b>${inspecao.data_planejada || '-'}</b></div>
            <div class="small">Executante: <b>${inspecao.executante_nome || '-'}</b></div>
            <div class="small">OS vinculada: <b>${inspecao.servico_id || 'Nenhuma'}</b></div>
          </div>
        `;
        
        document.getElementById("degradacao_desc").value = inspecao.degradacao_desc || "";
        document.getElementById("perda_desempenho_estimada").value = inspecao.perda_desempenho_estimada || "";

        document.getElementById("itens").innerHTML = inspecao.itens.map(item => `
          <tr>
            <td>
              <div style="font-weight:600; color:var(--text)">${item.titulo}</div>
              <div class="small" style="color:var(--acc2); cursor:pointer" title="${item.norma_titulo || ''}">
                ${item.norma_codigo ? `§ ${item.norma_codigo}` : 'Sem ref. normativa'}
              </div>
            </td>
            <td>
              <select id="c-${item.codigo}" style="padding:4px">
                <option ${item.condicao === "ok" ? "selected" : ""} value="ok">Conforme (OK)</option>
                <option ${item.condicao === "atencao" ? "selected" : ""} value="atencao">Atenção</option>
                <option ${item.condicao === "critico" ? "selected" : ""} value="critico">Crítico / Falha</option>
              </select>
            </td>
            <td>
              <select id="p-${item.codigo}" style="padding:4px">
                <option value="">Nenhuma</option>
                <option ${item.prioridade_reparo === "baixa" ? "selected" : ""} value="baixa">Baixa</option>
                <option ${item.prioridade_reparo === "media" ? "selected" : ""} value="media">Média</option>
                <option ${item.prioridade_reparo === "alta" ? "selected" : ""} value="alta">Alta</option>
              </select>
            </td>
            <td><input id="o-${item.codigo}" value="${item.observacao || ""}" placeholder="Detalhes..." style="padding:4px" /></td>
            <td><button class="btn btn-s btn-sm" onclick="saveItem('${item.codigo}', '${item.titulo.replace(/'/g, "\\'")}')">Salvar</button></td>
          </tr>
        `).join("");
      } catch (err) {
        xPredialUI.toast(err.message, "error");
      }
    }

    async function saveItem(codigo, titulo) {
      const id = Number(document.getElementById("inspecao").value);
      if (!id) return;
      try {
        await predialAPI.upsertItem(id, {
          codigo,
          titulo,
          condicao: document.getElementById(`c-${codigo}`).value,
          prioridade_reparo: document.getElementById(`p-${codigo}`).value || null,
          observacao: document.getElementById(`o-${codigo}`).value || null,
        });
        xPredialUI.toast(`Item ${titulo} atualizado`);
      } catch (err) {
        xPredialUI.toast(err.message, "error");
      }
    }

    document.getElementById("salvarAnalise").addEventListener("click", async () => {
      const id = Number(document.getElementById("inspecao").value);
      if (!id) return;
      try {
        const insp = await predialAPI.getInspecao(id);
        // Só tenta transicionar se ainda estiver planejada
        if (insp.status === 'planejada') {
          await predialAPI.transition(id, {
            para_status: "em_execucao",
            usuario: "operador",
            degradacao_desc: document.getElementById("degradacao_desc").value,
            perda_desempenho_estimada: document.getElementById("perda_desempenho_estimada").value,
          });
        } else if (insp.status === 'em_execucao') {
          // Já em execução: só registrar campos sem nova transição
          await predialAPI.transition(id, {
            para_status: "em_execucao",
            degradacao_desc: document.getElementById("degradacao_desc").value,
            perda_desempenho_estimada: document.getElementById("perda_desempenho_estimada").value,
          }).catch(() => {}); // Ignora erro de transição inválida
        }
        xPredialUI.toast("Análise técnica salva");
        await loadDetail();
      } catch (err) {
        xPredialUI.toast(err.message, "error");
      }
    });

    document.getElementById("iniciar").addEventListener("click", async () => {
      const id = Number(document.getElementById("inspecao").value);
      if (!id) return;
      try {
        await predialAPI.transition(id, { para_status: "em_execucao", usuario: "operador" });
        xPredialUI.toast("Inspeção iniciada");
        await loadDetail();
      } catch (err) {
        xPredialUI.toast(err.message, "error");
      }
    });

    document.getElementById("enviar").addEventListener("click", async () => {
      const id = Number(document.getElementById("inspecao").value);
      if (!id) return;
      try {
        await predialAPI.transition(id, { 
          para_status: "aguardando_aprovacao", 
          usuario: "operador",
          degradacao_desc: document.getElementById("degradacao_desc").value,
          perda_desempenho_estimada: document.getElementById("perda_desempenho_estimada").value
        });
        xPredialUI.toast("Enviado para aprovação");
        await loadDetail();
      } catch (err) {
        xPredialUI.toast(err.message, "error");
      }
    });

    document.getElementById("inspecao").addEventListener("change", loadDetail);
    document.getElementById("historicoBtn").addEventListener("click", () => {
      const sel = document.getElementById("inspecao");
      const id = sel.value;
      const url = id
        ? `historico-relatorios.html?inspecao_id=${id}`
        : `historico-relatorios.html`;
      window.location.href = url;
    });
    window.saveItem = saveItem;
    refreshSelect();
  </script>
</body>
</html>
