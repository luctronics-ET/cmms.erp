<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>xPredial - Historico e Relatorios</title>
  <link rel="stylesheet" href="assets/xpredial-core.css" />
    <link rel="stylesheet" href="../../assets/fonts.css"></head>
<body>
  <header id="top"></header>
  <main>
    <div class="grid" style="grid-template-columns: 300px 1fr">
      <section class="card">
        <h2>Filtros Avançados</h2>
        <div class="fg">
          <label>Localização</label>
          <select id="local"></select>
        </div>
        <div class="fg">
          <label>Status do Ciclo</label>
          <select id="status">
            <option value="">Todos os status</option>
            <option value="planejada">Planejada</option>
            <option value="em_execucao">Em Execução</option>
            <option value="aguardando_aprovacao">Aguardando Aprovação</option>
            <option value="aprovada">Aprovada</option>
            <option value="reprovada">Reprovada</option>
            <option value="concluida">Concluída</option>
          </select>
        </div>
        <button id="filtrar" class="btn btn-p" style="width:100%">Filtrar Histórico</button>
        <div class="divider"></div>
        <div id="resumo" style="font-family:var(--mono); font-size:11px; color:var(--text3)"></div>
      </section>

      <section class="card">
        <h2>Histórico de Manutenção</h2>
        <div class="tw">
          <table>
            <thead><tr><th>ID</th><th>Título</th><th>Local</th><th>Status</th><th>Última Atualização</th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>
  <script src="assets/predial-api.js"></script>
  <script src="assets/predial.js"></script>
  <script>
    xPredialUI.setHeader("historico-relatorios.html", "Rastreabilidade e auditoria de inspeções.");

    async function refresh() {
      try {
        await xPredialUI.loadLocaisSelect("local");
        const data = await predialAPI.historico({
          local_id: document.getElementById("local").value || undefined,
          status: document.getElementById("status").value || undefined,
        });
        document.getElementById("rows").innerHTML = data.map(r =>
          `<tr>
            <td><span class="small" style="font-family:var(--mono)">#${r.id}</span></td>
            <td><b style="color:var(--text)">${r.titulo}</b></td>
            <td>${r.local_nome}</td>
            <td>${xPredialUI.badge(r.status)}</td>
            <td class="small">${new Date(r.updated_at).toLocaleString('pt-BR')}</td>
          </tr>`
        ).join("");

        const resumo = await predialAPI.resumo();
        document.getElementById("resumo").innerHTML = `
          <div>KPIs Globais:</div>
          <div style="margin-top:4px">● Itens Críticos: <span style="color:var(--red)">${resumo.itens_criticos}</span></div>
          <div>● Laudos Técnicos: <span style="color:var(--acc2)">${resumo.total_laudos}</span></div>
        `;
      } catch (err) { xPredialUI.toast(err.message, "error"); }
    }

    document.getElementById("filtrar").addEventListener("click", refresh);
    refresh();
  </script>
</body>
</html>
