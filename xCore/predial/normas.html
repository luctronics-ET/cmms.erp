<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>xPredial - Referências Normativas</title>
  <link rel="stylesheet" href="assets/xpredial-core.css" />
    <link rel="stylesheet" href="../../assets/fonts.css"></head>
<body>
  <header id="top"></header>
  <main>
    <section class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px">
        <h2>Referências Normativas (ABNT)</h2>
        <button class="btn btn-p" onclick="abrirModal()">+ Nova Norma</button>
      </div>
      <div class="tw">
        <table>
          <thead>
            <tr>
              <th style="width:120px">Código</th>
              <th>Título</th>
              <th>Descrição</th>
              <th style="width:120px">Link</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="modalNorma" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:1000; align-items:center; justify-content:center; backdrop-filter:blur(2px)">
    <div class="modal" style="width:500px">
      <div class="mhdr">
        <h3>Adicionar Referência Normativa</h3>
        <button class="btn btn-s" onclick="fecharModal()" style="padding:4px 8px">✕</button>
      </div>
      <div class="mbody">
        <div class="grid" style="grid-template-columns:1fr 2fr">
          <div class="fg"><label>Código</label><input id="n-codigo" placeholder="Ex: NBR 5674"></div>
          <div class="fg"><label>Título</label><input id="n-titulo" placeholder="Ex: Manutenção de Edificações"></div>
        </div>
        <div class="fg"><label>Descrição / Objetivo</label><textarea id="n-desc" rows="3"></textarea></div>
        <div class="fg"><label>Link do Documento (URL)</label><input id="n-link" placeholder="https://..."></div>
      </div>
      <div class="mfooter">
        <button class="btn btn-p" onclick="salvar()">Salvar Referência</button>
      </div>
    </div>
  </div>

  <script src="assets/predial-api.js"></script>
  <script src="assets/predial.js"></script>
  <script>
    xPredialUI.setHeader("normas.html", "Base de conhecimento técnico e legal.");

    async function refresh() {
      try {
        const normas = await predialAPI.listNormas();
        document.getElementById("rows").innerHTML = normas.map(n => `
          <tr>
            <td><b style="color:var(--acc2); font-family:var(--mono)">${n.codigo}</b></td>
            <td><div style="font-weight:600; color:var(--text)">${n.titulo}</div></td>
            <td class="small">${n.descricao || '-'}</td>
            <td>${n.link_documento ? `<a href="${n.link_documento}" target="_blank" class="btn btn-s btn-sm">Acessar ↗</a>` : '-'}</td>
          </tr>
        `).join("");
      } catch (err) { xPredialUI.toast(err.message, "error"); }
    }

    function abrirModal() { document.getElementById("modalNorma").style.display = "flex"; }
    function fecharModal() { document.getElementById("modalNorma").style.display = "none"; }

    async function salvar() {
      try {
        await predialAPI.createNorma({
          codigo: document.getElementById("n-codigo").value,
          titulo: document.getElementById("n-titulo").value,
          descricao: document.getElementById("n-desc").value,
          link_documento: document.getElementById("n-link").value
        });
        xPredialUI.toast("Norma adicionada com sucesso");
        fecharModal();
        refresh();
      } catch (err) { xPredialUI.toast(err.message, "error"); }
    }

    refresh();
  </script>
</body>
</html>
