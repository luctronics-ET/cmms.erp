<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>xPredial - Aprovacoes</title>
  <link rel="stylesheet" href="assets/xpredial-core.css" />
    <link rel="stylesheet" href="../../assets/fonts.css"></head>
<body>
  <header id="top"></header>
  <main>
    <div class="grid two">
      <section class="card">
        <h2>Fila de Aprovação Técnica</h2>
        <div class="tw">
          <table>
            <thead><tr><th>ID</th><th>Título</th><th>Local</th><th>Status</th><th></th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </section>

      <section class="card">
        <h2>Parecer do Gestor</h2>
        <p class="small" style="margin-bottom: 12px">Revise os detalhes da inspeção antes de emitir o parecer.</p>
        <div class="fg">
          <label>ID da Inspeção</label>
          <input id="sel" readonly style="background:var(--bg3); font-family:var(--mono)" />
        </div>
        <div class="fg">
          <label>Comentário / Justificativa</label>
          <textarea id="comentario" rows="5" placeholder="Descreva observações sobre a conformidade ou motivos de reprovação..."></textarea>
        </div>
        <div style="display:flex; gap:10px">
          <button id="aprovar" class="btn btn-p" style="flex:1">✓ Aprovar</button>
          <button id="reprovar" class="btn btn-d" style="flex:1">✕ Reprovar</button>
        </div>
      </section>
    </div>
  </main>
  <script src="assets/predial-api.js"></script>
  <script src="assets/predial.js"></script>
  <script>
    xPredialUI.setHeader("aprovacoes.html", "Controle de qualidade e validação normativa.");

    async function refresh() {
      try {
        const list = await predialAPI.listInspecoes({ status: "aguardando_aprovacao" });
        document.getElementById("rows").innerHTML = list.map(i =>
          `<tr>
            <td><span class="small" style="font-family:var(--mono)">#${i.id}</span></td>
            <td><b style="color:var(--text)">${i.titulo}</b></td>
            <td>${i.local_nome}</td>
            <td>${xPredialUI.badge(i.status)}</td>
            <td><button class="btn btn-s btn-sm" onclick="pick(${i.id})">Revisar</button></td>
          </tr>`
        ).join("");
      } catch (err) { xPredialUI.toast(err.message, "error"); }
    }

    function pick(id) {
      document.getElementById("sel").value = id;
      xPredialUI.toast(`Inspeção #${id} selecionada para revisão`, "success");
    }

    async function transition(paraStatus) {
      const id = Number(document.getElementById("sel").value);
      if (!id) {
        xPredialUI.toast("Selecione uma inspeção primeiro", "error");
        return;
      }
      try {
        await predialAPI.transition(id, {
          para_status: paraStatus,
          usuario: "Gestor Predial",
          comentario: document.getElementById("comentario").value || null,
        });
        xPredialUI.toast(`Inspeção #${id} ${paraStatus === 'aprovada' ? 'aprovada' : 'reprovada'}`);
        document.getElementById("sel").value = "";
        document.getElementById("comentario").value = "";
        await refresh();
      } catch (err) { xPredialUI.toast(err.message, "error"); }
    }

    document.getElementById("aprovar").addEventListener("click", async () => { await transition("aprovada"); });
    document.getElementById("reprovar").addEventListener("click", async () => { await transition("reprovada"); });

    window.pick = pick;
    refresh();
  </script>
</body>
</html>
