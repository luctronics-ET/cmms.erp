<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMASM · xPaiol</title>
<script src="../assets/xcmasm-module-links.js"></script>
<style>
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#07111f;color:#e2eaf4;display:grid;place-items:center;min-height:100vh;margin:0}
.box{max-width:640px;padding:24px;border:1px solid rgba(0,180,216,.18);border-radius:14px;background:#0f2035}
a{color:#00b4d8}
</style>
</head>
<body>
  <div class="box">
    <h1 style="margin:0 0 12px;font-size:24px">Abrindo xPaiol</h1>
    <p style="margin:0 0 10px;line-height:1.6">Launcher do módulo xPaiol preparado para apontar tanto para a UI local quanto para uma URL externa configurada no portal.</p>
    <p style="margin:0">Se o redirecionamento não acontecer, abra <a id="paiol-launch" href="/paiol/paiois.html">/paiol/paiois.html</a>.</p>
  </div>
  <script>
    const paiolUrl = window.resolveXCMASMModuleUrl ? window.resolveXCMASMModuleUrl('paiol', 'appUrl') : '/paiol/paiois.html';
    const paiolAnchor = document.getElementById('paiol-launch');
    if (paiolAnchor) paiolAnchor.href = paiolUrl;
    window.location.replace(paiolUrl);
  </script>
</body>
</html>
