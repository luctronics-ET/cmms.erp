<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>xSeguranca</title>
  <style>
    :root {
      --bg: #08111d;
      --panel: #102136;
      --panel-2: #0d1a2b;
      --line: rgba(148, 163, 184, 0.18);
      --text: #e5eef8;
      --muted: #8ea3ba;
      --accent: #13b5d1;
      --ok: #22c55e;
      --warn: #f59e0b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background:
        radial-gradient(circle at top, rgba(19, 181, 209, 0.16), transparent 36%),
        linear-gradient(180deg, #07111f 0%, #091522 100%);
      color: var(--text);
      min-height: 100vh;
    }

    .shell {
      max-width: 1200px;
      margin: 0 auto;
      padding: 28px;
    }

    .hero {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: end;
      margin-bottom: 24px;
    }

    .hero h1 {
      margin: 0;
      font-size: 34px;
    }

    .hero p {
      margin: 8px 0 0;
      color: var(--muted);
      max-width: 720px;
    }

    .status {
      background: rgba(34, 197, 94, 0.12);
      color: #b8f7cb;
      border: 1px solid rgba(34, 197, 94, 0.25);
      border-radius: 999px;
      padding: 10px 14px;
      white-space: nowrap;
      font-size: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 18px;
    }

    .panel {
      background: linear-gradient(180deg, rgba(16, 33, 54, 0.98), rgba(13, 26, 43, 0.98));
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.22);
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
    }

    .panel-head h2 {
      margin: 0;
      font-size: 17px;
    }

    .camera-list {
      display: grid;
      gap: 12px;
      padding: 16px;
    }

    .camera {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      background: rgba(8, 17, 29, 0.45);
    }

    .camera h3 {
      margin: 0 0 6px;
      font-size: 16px;
    }

    .meta {
      color: var(--muted);
      font-size: 13px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .badge {
      color: #d7fce4;
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.24);
      border-radius: 999px;
      padding: 6px 10px;
      height: fit-content;
      font-size: 12px;
    }

    .viewer {
      padding: 16px;
    }

    .viewer img {
      width: 100%;
      display: block;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: #020617;
      margin-bottom: 12px;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    button {
      border: 1px solid rgba(19, 181, 209, 0.3);
      background: rgba(19, 181, 209, 0.12);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 12px;
      cursor: pointer;
    }

    button:hover {
      background: rgba(19, 181, 209, 0.22);
    }

    .log {
      padding: 16px;
      display: grid;
      gap: 10px;
    }

    .event {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      background: rgba(8, 17, 29, 0.45);
      font-size: 13px;
    }

    .event strong {
      display: block;
      margin-bottom: 6px;
    }

    .hint {
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 960px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .hero {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="hero">
      <div>
        <h1>xSeguranca</h1>
        <p>Painel operacional restaurado localmente para monitorar cameras, snapshots e eventos do modulo de seguranca.</p>
      </div>
      <div class="status" id="health">Validando backend...</div>
    </div>

    <div class="grid">
      <section class="panel">
        <div class="panel-head">
          <h2>Cameras</h2>
          <span class="hint" id="camera-count">0 itens</span>
        </div>
        <div class="camera-list" id="camera-list"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>Visualizacao</h2>
          <span class="hint" id="selected-name">Selecione uma camera</span>
        </div>
        <div class="viewer">
          <img id="snapshot" alt="Snapshot da camera selecionada">
          <div class="toolbar">
            <button id="refresh-btn">Atualizar snapshot</button>
            <button id="ptz-left">Pan esquerdo</button>
            <button id="ptz-right">Pan direito</button>
          </div>
          <div class="hint" id="ptz-result">Sem comando enviado.</div>
        </div>
      </section>
    </div>

    <section class="panel" style="margin-top: 18px;">
      <div class="panel-head">
        <h2>Eventos</h2>
        <span class="hint">Fluxo via WebSocket</span>
      </div>
      <div class="log" id="events"></div>
    </section>
  </div>

  <script>
    const cameraList = document.getElementById('camera-list');
    const events = document.getElementById('events');
    const snapshot = document.getElementById('snapshot');
    const health = document.getElementById('health');
    const cameraCount = document.getElementById('camera-count');
    const selectedName = document.getElementById('selected-name');
    const ptzResult = document.getElementById('ptz-result');
    let selectedCameraId = null;

    async function loadHealth() {
      const response = await fetch('/health');
      const data = await response.json();
      health.textContent = `Backend online · ${data.cameras} cameras`;
    }

    async function loadCameras() {
      const response = await fetch('/api/cameras');
      const data = await response.json();
      cameraCount.textContent = `${data.cameras.length} itens`;
      cameraList.innerHTML = '';

      data.cameras.forEach((camera, index) => {
        const node = document.createElement('button');
        node.className = 'camera';
        node.style.textAlign = 'left';
        node.innerHTML = `
          <div>
            <h3>${camera.name}</h3>
            <div class="meta">
              <span>ID: ${camera.id}</span>
              <span>${camera.type.toUpperCase()}</span>
              <span>${camera.thermal ? 'Termica' : 'RGB'}</span>
            </div>
          </div>
          <span class="badge">${camera.status}</span>
        `;
        node.onclick = () => selectCamera(camera.id, camera.name);
        cameraList.appendChild(node);
        if (index === 0) {
          selectCamera(camera.id, camera.name);
        }
      });
    }

    async function selectCamera(cameraId, cameraName) {
      selectedCameraId = cameraId;
      selectedName.textContent = cameraName;
      snapshot.src = `/api/cameras/${cameraId}/snapshot?ts=${Date.now()}`;
    }

    async function sendPTZ(pan) {
      if (!selectedCameraId) {
        return;
      }
      const response = await fetch(`/api/ptz/${selectedCameraId}/command`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pan, tilt: 0, zoom: 0, duration_ms: 250 })
      });
      const data = await response.json();
      ptzResult.textContent = `Pan=${data.state.pan} Tilt=${data.state.tilt} Zoom=${data.state.zoom}`;
      snapshot.src = `/api/cameras/${selectedCameraId}/snapshot?ts=${Date.now()}`;
    }

    function addEvent(message) {
      const item = document.createElement('div');
      item.className = 'event';
      item.innerHTML = `<strong>${message.camera_name}</strong><div>${message.detections.map(d => d.type).join(', ')}</div><div class="hint">${new Date(message.timestamp).toLocaleString('pt-BR')}</div>`;
      events.prepend(item);
      while (events.children.length > 8) {
        events.removeChild(events.lastChild);
      }
    }

    function connectEvents() {
      const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
      const ws = new WebSocket(`${protocol}://${location.host}/ws/events`);
      ws.onmessage = (event) => {
        const message = JSON.parse(event.data);
        if (message.type === 'detection') {
          addEvent(message.data);
        }
      };
    }

    document.getElementById('refresh-btn').onclick = () => {
      if (selectedCameraId) {
        snapshot.src = `/api/cameras/${selectedCameraId}/snapshot?ts=${Date.now()}`;
      }
    };
    document.getElementById('ptz-left').onclick = () => sendPTZ(-1);
    document.getElementById('ptz-right').onclick = () => sendPTZ(1);

    loadHealth();
    loadCameras();
    connectEvents();
  </script>
</body>
</html>
