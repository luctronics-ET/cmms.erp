version: '3.8'

services:
  # ========================================================================
  # Backend FastAPI
  # ========================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: vigilancia-backend
    ports:
      - "8000:8000"
    environment:
      - LOG_LEVEL=info
      - WORKERS=4
    volumes:
      - ./app.py:/app/app.py
      - ./configs:/app/configs
      - camera-cache:/tmp/camera-cache
    networks:
      - vigilancia-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    depends_on:
      - postgres
      - redis

  # ========================================================================
  # Frontend React (development)
  # ========================================================================
  frontend-dev:
    image: node:18-alpine
    container_name: vigilancia-frontend-dev
    working_dir: /app
    command: sh -c "npm install && npm start"
    ports:
      - "3001:3000"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./package.json:/app/package.json
      - ./tsconfig.json:/app/tsconfig.json
      - /app/node_modules
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - CHOKIDAR_USEPOLLING=true
    networks:
      - vigilancia-net
    restart: unless-stopped
    depends_on:
      - backend

  # ========================================================================
  # PostgreSQL (histórico de eventos)
  # ========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: vigilancia-postgres
    environment:
      POSTGRES_USER: vigilancia
      POSTGRES_PASSWORD: securepassword123
      POSTGRES_DB: vigilancia_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - vigilancia-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigilancia"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ========================================================================
  # Redis (cache e pubsub)
  # ========================================================================
  redis:
    image: redis:7-alpine
    container_name: vigilancia-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - vigilancia-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ========================================================================
  # PgAdmin (interface para banco de dados)
  # ========================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: vigilancia-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@vigilancia.local
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    networks:
      - vigilancia-net
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  camera-cache:

networks:
  vigilancia-net:
    driver: bridge
